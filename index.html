 // 세 번째 칸에는 실패, 성공, 히든 대사를 순서대로 입력하세요.

const characters = new Map();
let selectedCharacter = '헤일로';
for (const entries of Object.values(roster)) {
  for (const [name, [play, win, hidden], [loseLine, winLine, hiddenLine]] of entries) {
    characters.set(name, {
      images: { play, lose: play, win, hidden },
      dialogue: {
        lose: loseLine || '실패 대사',
        win: winLine || '성공 대사',
        hidden: hiddenLine || '히든 대사'
      }
    });
  }
}
const scenes = {
  play: '빼빼로를 물고 대기 중', win: '성공 엔딩',
  lose: '실패 엔딩', hidden: '히든 엔딩 · 뽀뽀 후 부끄러움'
};
const targets = [
  { success: [55, 80], perfect: [64, 70], duration: 1450 },
  { success: [34, 55], perfect: [42, 47], duration: 1180 },
  { success: [64, 83], perfect: [71, 75], duration: 950 }
];
const secretCenter = 20;
const [perfectLeft, perfectRight] = targets[2].perfect;
const secretHalfWidth = (perfectRight - perfectLeft) / 2;
const secretRange = [secretCenter - secretHalfWidth, secretCenter + secretHalfWidth];
const get = id => document.getElementById(id);
const action = get('action');
let art = get('art');
const sample = get('sample');
const message = get('message');
const verdict = { perfect:'퍼펙트', success:'성공', miss:'실패', hidden:'히든' };
let round = 0;
let results = [];
let phase = 'ready';
let position = 0;
let animation;
let startTime;

function launchConfetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#ff7198', '#ffe078', '#fff1df', '#a373dc', '#55c9b4'];
  const confetti = get('confetti');
  for (let index = 0; index < 42; index++) {
    const piece = document.createElement('i');
    piece.style.setProperty('--origin', index % 2 === 0 ? '32%' : '68%');
    piece.style.setProperty('--x', (Math.random() - .5) * 270 + 'px');
    piece.style.setProperty('--y', -35 - Math.random() * 125 + 'px');
    piece.style.setProperty('--spin', (Math.random() - .5) * 640 + 'deg');
    piece.style.setProperty('--size', 4 + Math.random() * 5 + 'px');
    piece.style.setProperty('--duration', 1150 + Math.random() * 650 + 'ms');
    piece.style.setProperty('--color', colors[index % colors.length]);
    piece.addEventListener('animationend', () => piece.remove(), { once: true });
    confetti.append(piece);
  }
}

let sceneRequest = 0;
async function showScene(next, zoom = 1) {
  const request = ++sceneRequest;
  const src = characters.get(selectedCharacter).images[next];
  let image = src && !art.hidden && art.getAttribute('src') === src ? art : null;
  if (src && !image) {
    const pending = new Image();
    pending.id = 'art';
    pending.src = src;
    try {
      await pending.decode();
      image = pending;
    } catch {
      image = null;
    }
  }
  if (request !== sceneRequest) return;
  get('scene').dataset.ending = next;
  get('dialogueText').textContent = characters.get(selectedCharacter).dialogue[next] ?? '...';
  get('confetti').replaceChildren();
  get('failureStamp').hidden = next !== 'lose';
  const caption = get('caption');
  caption.hidden = next !== 'win' && next !== 'hidden';
  caption.textContent = next === 'hidden' ? '앗, 입술이 닿아버렸다!' : '처음 두 번, 완벽한 타이밍을 맞추면…?';
  get('scene').style.background = {
    play:'radial-gradient(ellipse,#fff4ea,#e5a9a3)',
    win:'radial-gradient(ellipse,#fff4e1,#e99ba7)',
    lose:'radial-gradient(ellipse,#fff5ef,#c4aaa8)',
    hidden:'radial-gradient(ellipse,#fff0fa,#be94cf)'
  }[next];
  if (image) {
    image.alt = scenes[next];
    image.style.transform = 'scale(' + zoom + ')';
    if (image !== art) {
      art.replaceWith(image);
      art = image;
    }
    sample.hidden = true;
  } else {
    art.hidden = true;
    sample.style.transform = 'scale(' + zoom + ')';
    sample.hidden = false;
  }
  if (next === 'win') launchConfetti();
}

const isSuccess = result => result === 'success' || result === 'perfect';
const inside = (value, [left, right]) => value >= left && value <= right;
const secretOpen = () => round === 2 && results[0] === 'perfect' && results[1] === 'perfect';
function setZone(id, [left, right]) {
  get(id).style.left = left + '%';
  get(id).style.width = right - left + '%';
}
function drawRounds() {
  get('rounds').replaceChildren(...targets.map((_, index) => {
    const chip = document.createElement('span');
    chip.textContent = (index + 1) + 'R' + (results[index] ? ' · ' + verdict[results[index]] : '');
    chip.classList.toggle('current', index === round && phase !== 'ended');
    return chip;
  }));
}
function animateFeedback(element, frames, duration) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  element.getAnimations().forEach(animation => animation.cancel());
  element.animate(frames, { duration, easing: 'ease-out' });
}

function prepare() {
  phase = 'ready';
  position = 0;
  get('marker').style.left = '0%';
  const target = targets[round];
  setZone('success', target.success);
  setZone('perfect', target.perfect);
  setZone('secret', secretRange);
  get('secret').hidden = get('secretLegend').hidden = !secretOpen();
  showScene('play', 1 + round * .13);
  drawRounds();
  message.textContent = secretOpen() ? '마지막 라운드에 히든 구간이 열렸어!' : (round + 1) + '라운드 준비';
  action.textContent = '시작하기';
  animateFeedback(get('rounds').querySelector('.current'), [
    { transform: 'translateY(5px)', opacity: .5 },
    { transform: 'translateY(0)', opacity: 1 }
  ], 300);
  if (secretOpen()) animateFeedback(get('secret'), [
    { opacity: .35, boxShadow: '0 0 0 0 #8455ad80' },
    { opacity: 1, boxShadow: '0 0 0 7px #8455ad00' }
  ], 520);
}
function move(now) {
  const progress = ((now - startTime) / targets[round].duration) % 2;
  position = 100 * (progress <= 1 ? progress : 2 - progress);
  get('marker').style.left = position + '%';
  animation = requestAnimationFrame(move);
}
function stop() {
  const biteSound = get('bite-sound');
  biteSound.volume = .3;
  biteSound.currentTime = 0;
  biteSound.play().catch(() => {});
  cancelAnimationFrame(animation);
  const target = targets[round];
  let result = 'miss';
  if (secretOpen() && inside(position, secretRange)) result = 'hidden';
  else if (inside(position, target.perfect)) result = 'perfect';
  else if (inside(position, target.success)) result = 'success';
  results.push(result);
  const flash = {
    miss: '#b56a68', success: '#e58b9b', perfect: '#e4ae48', hidden: '#8455ad'
  }[result];
  animateFeedback(get('marker'), [
    { boxShadow: '0 0 0 2px #fff9f1' },
    { boxShadow: '0 0 0 7px ' + flash },
    { boxShadow: '0 0 0 2px #fff9f1' }
  ], 330);
  animateFeedback(message, [
    { opacity: .5, transform: 'translateY(5px)' },
    { opacity: 1, transform: 'translateY(0)' }
  ], 280);
  if (round === 2) {
    phase = 'ended';
    const total = results.filter(isSuccess).length;
    const ending = result === 'hidden' ? 'hidden' : total >= 2 ? 'win' : 'lose';
    showScene(ending);
    message.textContent = '';
    action.textContent = '다시 하기';
  } else {
    phase = 'stopped';
    message.textContent = verdict[result] + '!';
    action.textContent = '다음 라운드';
  }
  drawRounds();
  animateFeedback(get('rounds').children[round], [
    { transform: 'translateY(0)' },
    { transform: result === 'miss' ? 'translateY(6px)' : 'translateY(-7px)', offset: .38 },
    { transform: 'translateY(0)' }
  ], 360);
}
let stoppedOnPointerDown = false;
action.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  stoppedOnPointerDown = phase === 'running';
  if (stoppedOnPointerDown) stop();
});
action.addEventListener('click', event => {
  // A pointer release after stopping must not advance or restart the game.
  if (event.detail > 0 && stoppedOnPointerDown) {
    stoppedOnPointerDown = false;
    return;
  }
  if (phase === 'ready') {
    phase = 'running';
    message.textContent = '지금이다 싶은 순간에 멈춰!';
    action.textContent = '멈추기';
    startTime = performance.now();
    animation = requestAnimationFrame(move);
  } else if (phase === 'running') stop();
  else if (phase === 'stopped') {
    round++;
    prepare();
  } else {
    round = 0;
    results = [];
    prepare();
  }
});
document.addEventListener('keydown', event => {
  if (event.code !== 'Space' || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.target !== action && event.target.closest('select, input, summary, button, textarea, [contenteditable]')) return;
  event.preventDefault();
  if (!event.repeat) action.click();
});
const iconGroups = [
  [['헤일로','⚖️']],
  [['데미안','🖤'],['테오','🐶'],['바스티안','💙'],['로넌','💜'],['노아','💚'],['잭스','💔'],['팽','🔪'],['아이작','💉']],
  [['녹턴','💀'],['키스','💋'],['바이트','🦈'],['헤이즈','🦯'],['유닛','🤖','Unit-021'],['펜리르','🐺'],['스태틱','⚡']],
  [['압그룬트','🐙']],
  [['톡신','✳️'],['어비스','⚛️'],['캐스크','🎮'],['슬릿','🕸️'],['아네모네','🌼'],['트리거','⚠️']],
  [['라엘','🌕'],['바엘','🌑']]
];
const picker = get('characterPicker');
let selectedButton;
for (const [index, entries] of iconGroups.entries()) {
  const group = document.createElement('div');
  group.className = index === 3 ? 'icon-group strong-divider' : 'icon-group';
  for (const [name, icon, label = name] of entries) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = icon;
    button.title = label;
    button.setAttribute('aria-label', label);
    button.setAttribute('aria-pressed', String(name === selectedCharacter));
    if (name === selectedCharacter) selectedButton = button;
    button.addEventListener('click', () => {
      if (name === selectedCharacter) return;
      selectedButton.setAttribute('aria-pressed', 'false');
      button.setAttribute('aria-pressed', 'true');
      selectedButton = button;
      selectedCharacter = name;
      cancelAnimationFrame(animation);
      round = 0;
      results = [];
      prepare();
    });
    group.append(button);
  }
  picker.append(group);
}
prepare();
const bgm = document.getElementById('bgm');
const bgmToggle = document.getElementById('bgm-toggle');
const bgmVolume = document.getElementById('bgm-volume');

bgm.volume = Number(bgmVolume.value) / 100;

bgmVolume.addEventListener('input', () => {
  bgm.volume = Number(bgmVolume.value) / 100;
});

const firstInteraction = new AbortController();
const bgmStatus = get('bgm-status');

function updateBgmButton() {
  bgmToggle.textContent = bgm.paused ? '재생' : '정지';
}

function startBgm() {
  return bgm.play().catch(error => {
    if (error.name === 'AbortError' || !bgm.paused) return;
    updateBgmButton();
    if (error.name === 'NotAllowedError') return;
    bgmStatus.textContent = '브금을 불러오지 못했어요. 재생 버튼으로 다시 시도해 주세요.';
    bgmStatus.hidden = false;
  });
}

bgm.addEventListener('play', updateBgmButton);
bgm.addEventListener('playing', () => {
  bgmStatus.hidden = true;
  firstInteraction.abort();
  updateBgmButton();
});
bgm.addEventListener('pause', updateBgmButton);

function tryBgmOnInteraction(event) {
  if (event.target === bgmToggle || bgmToggle.contains(event.target)) return;
  if (bgm.paused) startBgm();
}

document.addEventListener('click', tryBgmOnInteraction, { capture: true, signal: firstInteraction.signal });
document.addEventListener('keydown', tryBgmOnInteraction, { signal: firstInteraction.signal });

bgmToggle.addEventListener('click', () => {
  if (bgm.paused) startBgm();
  else {
    firstInteraction.abort();
    bgmStatus.hidden = true;
    bgm.pause();
    bgm.currentTime = 0;
    updateBgmButton();
  }
});

startBgm();

const cursorHearts = get('cursorHearts');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let heartTimer;
let cursorX;
let cursorY;

function dropCursorHeart() {
  const heart = document.createElement('span');
  heart.className = 'cursor-heart';
  heart.textContent = '♥';
  heart.style.left = cursorX + 9 + 'px';
  heart.style.top = cursorY + 11 + 'px';
  heart.style.setProperty('--size', 12 + Math.random() * 8 + 'px');
  heart.style.setProperty('--drift', (Math.random() - .5) * 32 + 'px');
  heart.addEventListener('animationend', () => heart.remove(), { once: true });
  cursorHearts.append(heart);
}

function stopCursorHearts() {
  clearInterval(heartTimer);
  heartTimer = undefined;
  cursorHearts.replaceChildren();
}

document.addEventListener('pointermove', event => {
  if (event.pointerType !== 'mouse' || reducedMotion.matches || document.hidden) return;
  cursorX = event.clientX;
  cursorY = event.clientY;
  if (heartTimer !== undefined) return;
  dropCursorHeart();
  heartTimer = setInterval(dropCursorHeart, 145);
}, { passive: true });
document.documentElement.addEventListener('pointerleave', stopCursorHearts);
window.addEventListener('blur', stopCursorHearts);
document.addEventListener('visibilitychange', stopCursorHearts);
reducedMotion.addEventListener('change', stopCursorHearts);
